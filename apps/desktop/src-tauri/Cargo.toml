[package]
name = "alt-zmk-studio-desktop"
version = "0.1.0"
description = "Alt ZMK Studio desktop app"
authors = ["Alt ZMK Studio contributors"]
edition = "2021"

[lib]
name = "alt_zmk_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.9", default-features = false }
tauri = { version = "2.5", features = [] }
thiserror = "2"
tracing = "0.1"
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation"] }
zmk-studio-api = { version = "0.3.1", default-features = false }
